name: OpenSSF Scorecard

# Ocena higieny bezpieczeństwa repozytorium (przypięte zależności, uprawnienia tokenów, ochrona gałęzi,
# niebezpieczne wzorce workflow). Wyniki: zakładka Security → Code scanning oraz api.securityscorecards.dev.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 4 * * 1'
  branch_protection_rule:
  workflow_dispatch:

# Bez concurrency, env i defaults na poziomie workflow: publish_results akceptuje tylko prosty, zweryfikowany workflow.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # wysyłka wyników SARIF do Code scanning
      id-token: write         # publikacja wyników i odznaki
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
