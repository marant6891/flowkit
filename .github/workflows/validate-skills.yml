name: Validate Skills

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# PR: nowy push anuluje nieaktualny przebieg. main: grupa per commit, więc każdy commit ma własny wynik.
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Akcje przypięte do SHA commita (tag można przesunąć); Dependabot proponuje aktualizacje.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml python-docx ruff==0.15.13

      - name: Lint Python (ruff)
        run: ruff check .

      - name: Validate skills, agents, plugin manifests, secrets and unit tests
        run: python scripts/validate_all.py

      - name: Check installer is executable
        run: test -x scripts/install.sh
