# Testy aktywacji skilli: czy właściwy skill uruchamia się, a niewłaściwy pozostaje nieaktywny.
skills:
  flowkit-client-pt-prd-writer:
    should_trigger:
      - Przygotuj dokument PT dla zmiany w formularzu zamówienia na podstawie załączonego zgłoszenia.
      - Napisz PRD dla nowej funkcji eksportu raportów.
      - Potrzebuję specyfikacji zmiany dla klienta z tych materiałów.
      - Opracuj analizę przedwdrożeniową integracji z systemem ERP.
      - Zrób dokumentację change requestu w szablonie klienta.
      - Przygotuj projekt techniczny tej modyfikacji aplikacji.
    should_not_trigger:
      - Napraw błąd walidacji w pliku orders.py.
      - Podsumuj to spotkanie w mailu do klienta.
      - Przygotuj raport postmortem z awarii bazy danych.
      - Mam tylko luźny pomysł na aplikację, przeprowadź mnie krok po kroku przez wymagania.
  flowkit-requirements-workshop:
    should_trigger:
      - Mam pomysł na aplikację do obsługi zwrotów w sklepie, przeprowadź mnie przez wymagania.
      - Poprowadź mnie krok po kroku od koncepcji do specyfikacji, bez trybu automatycznego.
      - Zróbmy warsztat wymagań dla nowego modułu rezerwacji.
      - Wznów warsztat wymagań projektu KSeF.
      - Chcę doprecyzować luźny pomysł i dojść do wymagań biznesowych i technicznych.
    should_not_trigger:
      - Przygotuj dokument PT na podstawie załączonego briefu i zgłoszenia.
      - Podsumuj to spotkanie w mailu do klienta.
      - Napisz zapytanie SQL zliczające zamówienia.
      - Napraw błąd w pliku orders.py.
      - Przygotuj raport postmortem z wczorajszej awarii.
  flowkit-client-meeting-recap:
    should_trigger:
      - Podsumuj to spotkanie na podstawie transkrypcji VTT.
      - Przygotuj mail z ustaleniami po spotkaniu z klientem.
      - Zrób recap z notatek ze spotkania i wypisz zadania.
      - Mam transkrypcję z Teams, potrzebuję listy decyzji i właścicieli zadań.
      - Przygotuj notatkę po spotkaniu oraz radar ryzyk dla zespołu.
      - Stwórz podsumowanie rozmowy z klientem z tego pliku.
    should_not_trigger:
      - Napisz PRD dla modułu raportów.
      - Zaplanuj agendę przyszłego spotkania.
      - Przetłumacz ten mail na angielski.
      - Przeanalizuj logi aplikacji z ostatniej godziny.
  flowkit-sql-data-assistant:
    should_trigger:
      - Przygotuj zapytanie SQL pokazujące zamówienia klienta z ostatniego miesiąca.
      - Potrzebuję zestawienia z bazy z liczbą zgłoszeń według statusu.
      - Sprawdź w bazie, czy dane z tego zgłoszenia są poprawne, przygotuj SELECT.
      - Napisz INSERT dodający brakujący rekord do tabeli klientów.
      - Przygotuj bezpieczny UPDATE poprawiający adres e-mail klienta.
      - Znajdź duplikaty w tabeli zamówień zapytaniem SQL.
    should_not_trigger:
      - Napisz PRD dla modułu raportów.
      - Przygotuj Dockerfile dla bazy PostgreSQL.
      - Podsumuj spotkanie o migracji bazy danych.
      - Wyjaśnij, czym jest normalizacja danych.
  flowkit-devops-incident-postmortem:
    should_trigger:
      - Przygotuj postmortem po wczorajszej awarii produkcji.
      - Zrób RCA tego incydentu na podstawie logów i alertów.
      - Napisz raport z awarii SEV-1 z osią czasu.
      - Przeanalizuj przyczyny incydentu i zaproponuj działania naprawcze.
      - Opracuj blameless postmortem z zapisu kanału incydentowego.
      - Potrzebuję analizy 5 Whys dla tej awarii usługi płatności.
    should_not_trigger:
      - Napisz Dockerfile dla aplikacji Node.js.
      - Przygotuj pipeline CI w GitHub Actions.
      - Podsumuj spotkanie zespołu DevOps.
      - Dodaj alert dla wysokiego użycia pamięci.
  flowkit-client-message-editor:
    should_trigger:
      - Złagodź ton tej wiadomości do klienta, jestem zdenerwowany opóźnieniem.
      - Przeredaguj ten mail tak, żeby był dupokrytką z potwierdzeniem ustaleń.
      - Skróć tę wiadomość na Teams do klienta i dodaj jasną prośbę z terminem.
      - Zrób z tego szkicu maila potwierdzenie ustaleń na piśmie, klient zmienił zakres.
      - Przeredaguj ten mail prostym językiem, bez korpomowy i kalk z angielskiego.
      - Popraw angielski w tym mailu do klienta, żeby brzmiał naturalnie.
    should_not_trigger:
      - Podsumuj spotkanie z tej transkrypcji VTT i przygotuj mail do klienta.
      - Przygotuj dokument PT na podstawie briefu.
      - Napisz zapytanie SQL zliczające klientów.
      - Przygotuj raport postmortem z awarii.
  flowkit-client-solution-docs-writer:
    should_trigger:
      - Przygotuj help dla użytkownika końcowego do modułu zwrotów na podstawie kodu w src/returns.
      - Napisz instrukcję obsługi aplikacji dla klientów sklepu w naszym szablonie Word.
      - Zrób podręcznik użytkownika z kodu tego repozytorium dla działu księgowości.
      - Potrzebuję instrukcji administratora dla tego rozwiązania, szablon w docs/szablon.dotx.
      - Opisz działanie aplikacji dla zespołu IT klienta na podstawie kodu, dokumentacja techniczna rozwiązania.
      - Przygotuj FAQ i szybki start dla użytkowników panelu na podstawie kodu.
    should_not_trigger:
      - Przygotuj dokument PT dla planowanej zmiany w formularzu zamówienia.
      - Popraw tego maila do klienta przed wysłaniem.
      - Napraw błąd walidacji w pliku orders.py.
      - Podsumuj spotkanie z pliku VTT.
  flowkit-devops-sre-review:
    should_trigger:
      - Zrób przegląd SRE tej usługi na podstawie manifestów i reguł alertów.
      - Oceń gotowość produkcyjną serwisu płatności pod kątem niezawodności.
      - Czy nasze SLO i alerty są dobrze ustawione? Sprawdź pliki w monitoring/.
      - Przejrzyj sondy, requests i limity oraz HPA w tym chart Helm.
      - Oceń backup i RPO/RTO naszej bazy na podstawie tej konfiguracji.
      - Mamy alert fatigue, przeanalizuj nasze reguły Prometheus.
    should_not_trigger:
      - Przygotuj postmortem po wczorajszej awarii.
      - Napisz Dockerfile dla aplikacji Go.
      - Podsumuj spotkanie zespołu SRE.
      - Przygotuj zapytanie SQL o liczbę zamówień.
