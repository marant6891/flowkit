# Fikcyjny manifest do testów: brak readinessProbe, brak resources, liveness zależny od bazy, tag latest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: api
          image: payments-api:latest
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/db
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 1
